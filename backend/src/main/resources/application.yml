spring:
  datasource:
    url: jdbc:mysql://localhost:3306/doday
    username: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update  # create-drop → update로 변경
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  config:
    import: application-secret.yml
  profiles:
    include: secret
  batch:
    job: # 배치 작업의 단위
      enabled: false  # Spring Batch는 실행 시 자동으로 Job을 실행하려 함
                      # false로 설정해야 스케줄러가 원하는 시간에만 실행 가능
                      # true면 서버 시작할 때마다 배치가 돌아버림
    jdbc:
      initialize-schema: always  # 배치 실행 이력을 저장하는 메타 테이블 자동 생성
                                 # BATCH_JOB_INSTANCE, BATCH_JOB_EXECUTION 등
                                # 배치가 언제 실행됐는지, 성공/실패 여부 기록

server:
  port: 8080